name: Update government policy feed

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_policy_news.py'
      - '.github/workflows/update-policy-news.yml'

permissions:
  contents: write

concurrency:
  group: government-policy-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 urllib3
      - name: Fetch official government policy content
        run: python scripts/update_policy_news.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/policy-news.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "naeillab-policy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/policy-news.json
          git commit -m "자동 업데이트: 정부 정책·카드뉴스"
          git push
