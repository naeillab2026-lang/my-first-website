name: Update policy card news

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 feedparser
      - name: Fetch official policy card news
        run: python scripts/update_policy_news.py
      - name: Commit changes
        run: |
          if git diff --quiet -- data/policy-news.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "naeillab-policy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/policy-news.json
          git commit -m "자동 업데이트: 정부 정책 카드뉴스"
          git push
